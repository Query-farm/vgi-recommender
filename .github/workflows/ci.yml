name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Let docker-publish.yml / release.yml gate on this workflow via `uses:`.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_recommender/ recommender_worker.py

      - name: Docstring lint (pydoclint)
        # Run in an isolated env: vgi-rpc pulls canonical docstring-parser while
        # pydoclint needs docstring-parser-fork (same top-level module), and the
        # collision breaks `uv run pydoclint` in CI.
        run: uvx pydoclint --config pyproject.toml vgi_recommender/ recommender_worker.py

  # Gate the worker's catalog/function metadata quality (descriptions, examples,
  # provenance tags, documented return columns) with the signed vgi-lint
  # community extension. Kept a separate job so the metadata score stays visible.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker
        run: uv sync --all-extras --python 3.14

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Use the project venv's python, not `uv run <script>`: the PEP 723
          # script env caches a resolved SDK, so `uv run` can attach with a stale
          # vgi-python and emit an outdated catalog schema (false lint mismatch).
          # The venv (just synced above) is deterministic and matches runtime.
          location: ".venv/bin/python recommender_worker.py"
          fail-on: info

  # The SQL suite (test/sql/*.test) through the published haybarn-unittest and the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starter template): stdio (DuckDB spawns the worker per
  # connection), launch (DuckDB starts it once on an AF_UNIX socket and pools
  # connections) and http (the worker serves --http).
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.1rc3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/.venv/bin/vgi-recommender" \
          HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
